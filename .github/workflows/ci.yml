name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  unit-tests:
    name: Python unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r lambda/requirements.txt -r lambda/requirements-dev.txt
      - name: Run unit tests
        run: pytest tests/unit -v

  cdk-build:
    name: CDK TypeScript build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install CDK dependencies
        run: npm ci
        working-directory: cdk
      - name: Run CDK tests
        run: npm test -- --runInBand
        working-directory: cdk
